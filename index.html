<script>
const firebaseConfig={
  apiKey:"AIzaSyCfzjZTi-4nbiPmByAzEn5XRIqarWheT0k",

  apiKey:"AIzaSyDFflfD15ScmCWLD2pmt2fqMamnV6Fjup4",
  authDomain:"raportakip-10cfc.firebaseapp.com",
  projectId:"raportakip-10cfc",

  messagingSenderId:"250817491437",
  appId:"1:250817491437:web:3ca15f873b0e80c3d737e4"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const sourceApp=firebase.initializeApp(sourceFirebaseConfig,"sourceStoresApp");
const sourceDb=firebase.firestore(sourceApp);

const TRACK_COL="opening_readiness_2026";
const CUSTOM_COL="opening_custom_stores_2026";
const OVERRIDE_COL="opening_store_overrides_2026";
const ADMIN_PIN="1234";
const FLOORS=["ZEMÄ°N","1BK","2BK","3BK","4BK"];
const LAUNCH_DATE="2026-08-30";

let sourceStores=[],customStores=[],storeOverrides={},tracking={},adminMode=false,floorFilter="ALL",statusFilter="ALL";
const $=id=>document.getElementById(id);

function clean(v){return String(v??"").replace(/\s+/g," ").trim()}
function norm(v){return clean(v).toUpperCase().replace(/Ä°/g,"I").replace(/Ä/g,"G").replace(/Ãœ/g,"U").replace(/Å/g,"S").replace(/Ã–/g,"O").replace(/Ã‡/g,"C")}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function idSafe(v){return norm(v).replace(/[^A-Z0-9]+/g,"_").replace(/^_|_$/g,"")}
function normalizeFloorName(v){
  const k=norm(v);
  if(["ZK","ZEMIN","ZEMIN KAT","ZEMIN KATI","0","0K","0BK"].includes(k))return "ZEMÄ°N";
  if(["B1","1BK","1 BK","1.KAT","1 KAT","BODRUM 1","-1"].includes(k))return "1BK";
  if(["B2","2BK","2 BK","2.KAT","2 KAT","BODRUM 2","-2"].includes(k))return "2BK";
  if(["B3","3BK","3 BK","3.KAT","3 KAT","BODRUM 3","-3"].includes(k))return "3BK";
  if(["B4","4BK","4 BK","4.KAT","4 KAT","BODRUM 4","-4"].includes(k))return "4BK";
  return clean(v)
}
function pickFirst(x,keys){for(const k of keys){if(x&&x[k]!=null&&clean(x[k]))return clean(x[k])}return ""}
function isUnnamed(s){return !clean(s.name)||norm(s.name)==="ISIMSIZ MAGAZA"||norm(s.name)==="ISIMSIZ"}
function isDepotRaw(x,name,lot){
  const typeText=norm([name,lot,x.type,x.tip,x.tur,x.tÃ¼r,x.category,x.kategori,x.unitType,x.mahalTipi].filter(Boolean).join(" "));
  return /\bDEPO\b/.test(typeText)||/\bWAREHOUSE\b/.test(typeText)
}
function sourceStore(d,id){
  const x=d||{};
  const kat=normalizeFloorName(pickFirst(x,["kat","Kat","KAT","floor","Floor","FLOOR","sheet","Sheet","SHEET","katAdi","katAdÄ±","katName","blok","seviye","level"]));
  const lot=pickFirst(x,["lot","Lot","LOT","lotNo","LotNo","LOT NO","LOT_NO","lotNumarasi","lotNumarasÄ±","maÄŸazaNo","magazaNo","depoNo","unitNo","unit","no"]);
  const name=pickFirst(x,["name","Name","magaza","maÄŸaza","magazaAdi","maÄŸazaAdÄ±","magazaAdÄ±","maÄŸazaAdi","storeName","store","tenant","kiraci","kiracÄ±","MAÄAZA ADI","MAGAZA ADI"]);
  if(!name&&!lot)return null;
  if(isDepotRaw(x,name,lot))return null;
  return {id:"src_"+String(id),sourceId:String(id),kat,lot,name,origin:"source"}
}
function allStores(){
  const arr=[];

  for(const src of sourceStores){
    const ov=storeOverrides[src.id]||{};
    if(ov.deleted===true)continue;
    arr.push({
      ...src,
      kat:ov.kat!=null?normalizeFloorName(ov.kat):src.kat,
      lot:ov.lot!=null?clean(ov.lot):src.lot,
      name:ov.name!=null?clean(ov.name):src.name
    });
  }

  for(const c of customStores){
    if(c.deleted===true)continue;
    arr.push(c);
  }

  return arr.sort((a,b)=>{
    const fa=FLOORS.indexOf(a.kat), fb=FLOORS.indexOf(b.kat);
    const f=(fa<0?999:fa)-(fb<0?999:fb);
    if(f)return f;
    const n=(a.name||"").localeCompare(b.name||"","tr",{numeric:true,sensitivity:"base"});
    if(n)return n;
    return (a.lot||"").localeCompare(b.lot||"","tr",{numeric:true});
  });
}
function normalizedState(raw){
  const st={status:"unknown",delay:"",note:"",updatedAt:"",openingDate:"",...(raw||{})};
  // V4 uyumluluÄŸu: AÃ§Ä±lÄ±yor ve Raflara Diziyor olan 85 maÄŸaza,
  // 30.08.2026 aÃ§Ä±lÄ±ÅŸ grubuna otomatik olarak alÄ±nÄ±r.
  if(st.status==="opening"||st.status==="stocking"){
    st.status="openedaug30";
    st.openingDate=LAUNCH_DATE;
  }
  if(st.status==="openedaug30"&&!st.openingDate)st.openingDate=LAUNCH_DATE;
  return st
}
function stateOf(s){return normalizedState(tracking[s.id])}
function todayISO(){
  const d=new Date(),pad=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`
}
function formatDateTR(v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v||""))return "";
  const [y,m,d]=v.split("-");return `${d}.${m}.${y}`
}
function statusText(st){
  if(st.status==="openedaug30")return "30.08.2026'da aÃ§Ä±ldÄ±";
  if(st.status==="openedlater")return st.openingDate?formatDateTR(st.openingDate)+" tarihinde aÃ§Ä±ldÄ±":"EylÃ¼l ve sonrasÄ±nda aÃ§Ä±ldÄ±";
  if(st.status==="delayed")return st.delay?"Gecikiyor Â· "+st.delay:"Gecikiyor";
  if(st.status==="notstarted")return "Ä°malat baÅŸlamadÄ±";
  if(st.status==="notreceived")return "Teslim almadÄ±";
  return "HenÃ¼z deÄŸerlendirilmedi"
}
function nowTR(){return new Date().toLocaleString("tr-TR",{dateStyle:"short",timeStyle:"short"})}

async function setStoreStatus(id,status){
  const old=normalizedState(tracking[id]);
  const isOpen=status==="openedaug30"||status==="openedlater";
  const openingDate=status==="openedaug30"?LAUNCH_DATE:(status==="openedlater"?(old.status==="openedlater"&&old.openingDate?old.openingDate:todayISO()):"");
  const payload={status,delay:status==="delayed"?(old.delay||"1 hafta"):"",note:old.note||"",openingDate:isOpen?openingDate:"",updatedAt:nowTR()};
  tracking[id]={...old,...payload};render();
  try{await db.collection(TRACK_COL).doc(id).set(payload,{merge:true})}
  catch(e){console.error(e);alert("Durum kaydedilemedi.")}
}
async function setDelay(id,value){
  const old=tracking[id]||{};
  const payload={status:"delayed",delay:value,note:old.note||"",updatedAt:nowTR()};
  tracking[id]={...old,...payload};render();
  try{await db.collection(TRACK_COL).doc(id).set(payload,{merge:true})}
  catch(e){console.error(e)}
}
let noteTimers={};
function saveNoteLater(id,value){
  tracking[id]={...(tracking[id]||{}),note:value};
  clearTimeout(noteTimers[id]);
  noteTimers[id]=setTimeout(async()=>{
    const old=normalizedState(tracking[id]);
    await db.collection(TRACK_COL).doc(id).set({
      status:old.status||"unknown",delay:old.delay||"",note:value,openingDate:old.openingDate||"",updatedAt:nowTR()
    },{merge:true})
  },500)
}

function setFloorFilter(v){floorFilter=v;render()}
function setStatusFilter(v){statusFilter=v;render()}
function visibleStores(){
  const q=norm($("searchInput").value||"");
  const showUnnamed=$("showUnnamed").checked;
  return allStores().filter(s=>{
    if(!showUnnamed&&isUnnamed(s))return false;
    if(floorFilter!=="ALL"&&s.kat!==floorFilter)return false;
    if(statusFilter!=="ALL"&&stateOf(s).status!==statusFilter)return false;
    if(q&&!norm([s.name,s.lot,s.kat].join(" ")).includes(q))return false;
    return true
  })
}

function render(){
  renderTabs();renderKpis();
  const list=visibleStores();
  const groups={};
  list.forEach(s=>{const k=s.kat||"KAT BÄ°LGÄ°SÄ° YOK";(groups[k]||(groups[k]=[])).push(s)});
  const keys=Object.keys(groups).sort((a,b)=>FLOORS.indexOf(a)-FLOORS.indexOf(b));
  if(!keys.length){$("content").innerHTML='<div class="empty">Bu filtreye uygun maÄŸaza yok.</div>';return}
  $("content").innerHTML=keys.map(f=>{
    const arr=groups[f];
    return `<section class="floorSection">
      <div class="floorHead">
        <h2>${esc(f)}</h2>
        <div class="floorMeta">${arr.length} maÄŸaza</div>
      </div>
      <div class="grid">${arr.map(cardHtml).join("")}</div>
    </section>`
  }).join("")
}

async function addStore(){
  if(!adminMode)return;
  const kat=$("newFloor").value, lot=clean($("newLot").value), name=clean($("newName").value);
  if(!kat||!lot||!name)return alert("Kat, lot ve maÄŸaza adÄ± gerekli.");
  const id="custom_"+idSafe(kat+"_"+lot+"_"+name)+"_"+Date.now();
  await db.collection(CUSTOM_COL).doc(id).set({kat,lot,name,createdAt:nowTR()});
  $("newLot").value="";$("newName").value="";
}
async function deleteStore(id){
  if(!adminMode)return;
  const s=allStores().find(x=>x.id===id);
  if(!s)return;
  if(!confirm((s.name||"Ä°simsiz MaÄŸaza")+" silinsin mi?"))return;

  if(s.origin==="custom"){
    await db.collection(CUSTOM_COL).doc(id).delete();
    await db.collection(TRACK_COL).doc(id).delete().catch(()=>{});
  }else{
    await db.collection(OVERRIDE_COL).doc(id).set({
      deleted:true,
      updatedAt:nowTR()
    },{merge:true});
  }
  closeEditStoreModal();
}

      <button class="btn btnDanger" onclick="deleteStore('${esc(s.id)}')">Sil</button>
    </div>`).join(""):'<div class="empty">MaÄŸaza bulunamadÄ±.</div>'
}


function openEditStoreModal(id){
  if(!adminMode)return;
  const s=allStores().find(x=>x.id===id);
  if(!s)return;
  $("editStoreId").value=s.id;
  $("editFloor").value=FLOORS.includes(s.kat)?s.kat:"ZEMÄ°N";
  $("editLot").value=s.lot||"";
  $("editName").value=s.name||"";
  const st=stateOf(s);
  $("editStatus").value=st.status||"unknown";
  $("editDelay").value=st.delay||"1 hafta";
  $("editOpeningDate").value=st.openingDate||(st.status==="openedaug30"?LAUNCH_DATE:todayISO());
  $("editNote").value=st.note||"";
  toggleEditFields();
  $("editStoreOverlay").classList.add("show");
}
function closeEditStoreModal(){
  $("editStoreOverlay").classList.remove("show");
  $("editStoreId").value="";
}
function toggleEditFields(){
  const status=$("editStatus").value;
  $("editDelayField").style.display=status==="delayed"?"block":"none";
  $("editOpeningDateField").style.display=(status==="openedaug30"||status==="openedlater")?"block":"none";
  if(status==="openedaug30")$("editOpeningDate").value=LAUNCH_DATE;
  if(status==="openedlater"&&(!$("editOpeningDate").value||$("editOpeningDate").value===LAUNCH_DATE))$("editOpeningDate").value=todayISO();
}
async function saveStoreEdit(){
  if(!adminMode)return;
  const id=$("editStoreId").value;
  const s=allStores().find(x=>x.id===id);
  if(!s)return;

  const kat=$("editFloor").value;
  const lot=clean($("editLot").value);
  const name=clean($("editName").value);

  if(!kat||!lot||!name)return alert("Kat, lot ve maÄŸaza adÄ± gerekli.");

  if(s.origin==="custom"){
    await db.collection(CUSTOM_COL).doc(id).set({
      kat,lot,name,updatedAt:nowTR()
    },{merge:true});
  }else{
    await db.collection(OVERRIDE_COL).doc(id).set({
      kat,lot,name,deleted:false,updatedAt:nowTR()
    },{merge:true});
  }

  const status=$("editStatus").value||"unknown";
  const delay=status==="delayed"?$("editDelay").value:"";
  const openingDate=status==="openedaug30"?LAUNCH_DATE:(status==="openedlater"?$("editOpeningDate").value:"");
  const note=clean($("editNote").value);

  if(status==="openedlater"&&(!openingDate||openingDate<=LAUNCH_DATE)){
    return alert("EylÃ¼l ve sonrasÄ± aÃ§Ä±lan maÄŸaza iÃ§in 30.08.2026'dan sonraki bir tarih seÃ§in.");
  }

  await db.collection(TRACK_COL).doc(id).set({
    status,delay,note,openingDate,updatedAt:nowTR()
  },{merge:true});

  tracking[id]={...(tracking[id]||{}),status,delay,note,openingDate,updatedAt:nowTR()};
  closeEditStoreModal();
  render();
}
async function deleteStoreFromEdit(){
  const id=$("editStoreId").value;
  if(id)await deleteStore(id);
}


function exportExcel(){
  if(!adminMode)return;
  if(typeof XLSX==="undefined"){
    alert("Excel kÃ¼tÃ¼phanesi yÃ¼klenemedi. Ä°nternet baÄŸlantÄ±sÄ±nÄ± kontrol edin.");
    return;
  }

  const stores=allStores();
  const rows=stores.map(s=>{
    const st=stateOf(s);
    return {
      "Kat":s.kat||"",
      "Lot":s.lot||"",
      "MaÄŸaza AdÄ±":s.name||"Ä°simsiz MaÄŸaza",
      "Durum":statusText(st),
      "AÃ§Ä±lÄ±ÅŸ Grubu":st.status==="openedaug30"?"30.08.2026 AÃ§Ä±lÄ±ÅŸÄ±":(st.status==="openedlater"?"EylÃ¼l ve SonrasÄ±":""),
      "AÃ§Ä±lÄ±ÅŸ Tarihi":st.openingDate?formatDateTR(st.openingDate):"",
      "Gecikme Tahmini":st.status==="delayed"?(st.delay||""):"",
      "KÄ±sa Not":st.note||"",
      "Son GÃ¼ncelleme":st.updatedAt||""
    };
  });

  const aug30Count=stores.filter(s=>stateOf(s).status==="openedaug30").length;
  const laterCount=stores.filter(s=>stateOf(s).status==="openedlater").length;
  const delayedCount=stores.filter(s=>stateOf(s).status==="delayed").length;
  const notStartedCount=stores.filter(s=>stateOf(s).status==="notstarted").length;
  const notReceivedCount=stores.filter(s=>stateOf(s).status==="notreceived").length;
  const unknownCount=stores.filter(s=>stateOf(s).status==="unknown").length;

  const summaryRows=[
    {"BaÅŸlÄ±k":"Toplam MaÄŸaza","Adet":stores.length},
    {"BaÅŸlÄ±k":"30.08.2026'da AÃ§Ä±lan","Adet":aug30Count},
    {"BaÅŸlÄ±k":"EylÃ¼l ve SonrasÄ± AÃ§Ä±lan","Adet":laterCount},
    {"BaÅŸlÄ±k":"Gecikiyor","Adet":delayedCount},
    {"BaÅŸlÄ±k":"Ä°malat BaÅŸlamadÄ±","Adet":notStartedCount},
    {"BaÅŸlÄ±k":"Teslim AlmadÄ±","Adet":notReceivedCount},
    {"BaÅŸlÄ±k":"HenÃ¼z DeÄŸerlendirilmedi","Adet":unknownCount}
  ];

  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.json_to_sheet(rows);
  const wsSummary=XLSX.utils.json_to_sheet(summaryRows);

  ws["!cols"]=[
    {wch:12},{wch:14},{wch:28},{wch:30},{wch:24},{wch:16},{wch:20},{wch:38},{wch:20}
  ];
  wsSummary["!cols"]=[{wch:38},{wch:12}];

  XLSX.utils.book_append_sheet(wb,ws,"MaÄŸazalar");
  XLSX.utils.book_append_sheet(wb,wsSummary,"Ã–zet");

  const d=new Date();
  const pad=n=>String(n).padStart(2,"0");
  const fileName=`Koru_Florya_Acilis_Takip_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}.xlsx`;
  XLSX.writeFile(wb,fileName);
}
